name: cantavue_website
description: CantaVue official promotional website.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.3
  flutter: '>=3.41.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  # Supplies the font used by reachable adaptive Flutter controls; MIT, no plugin.
  cupertino_icons: 1.0.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand.png
    - assets/hero.png
    - assets/scenes/
    - assets/fonts/OFL-NotoSansSC.txt
    - assets/fonts/OFL-NotoSansTC.txt
    - assets/fonts/OFL-Multilingual.txt
  fonts:
    - family: CantaSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-700.ttf
          weight: 700
    - family: CantaSansTC
      fonts:
        - asset: assets/fonts/NotoSansTC-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTC-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTC-700.ttf
          weight: 700
    - family: CantaMultilingual
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: CantaArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf
    - family: CantaHebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew-Variable.ttf
    - family: CantaDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf
    - family: CantaThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Variable.ttf
    - family: CantaCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
